version: "3.9"
# Local development only. Production Postgres is Azure Database for PostgreSQL
# Flexible Server, Canada Central — provisioned via infra/main.tf, never this file.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: phoenix_dev_only
      POSTGRES_DB: phoenix_iv_dev
    ports:
      - "5432:5432"
    volumes:
      - phoenix_pg_data:/var/lib/postgresql/data

volumes:
  phoenix_pg_data:
