version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Security patches land as individual PRs for visibility; routine
      # minor/patch bumps of unrelated packages are grouped so they don't
      # flood review for a system where every dependency change should get
      # a human look before merge (health-data system, not a hobby project).
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]

  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "infra"]
