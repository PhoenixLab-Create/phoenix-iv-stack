databases:
  - name: phoenix-iv-db
    plan: free
    databaseName: phoenix_iv_dev
    user: phoenix

services:
  - type: web
    name: phoenix-iv-backend
    runtime: docker
    plan: free
    dockerfilePath: ./phoenix-iv-platform/Dockerfile
    dockerContext: ./phoenix-iv-platform
    envVars:
      - key: NODE_ENV
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: phoenix-iv-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_TTL
        value: 12h
      - key: STAFF_IDLE_TIMEOUT_SECONDS
        value: "900"
      - key: PATIENT_IDLE_TIMEOUT_SECONDS
        value: "300"
      - key: MFA_ISSUER
        value: "Phoenix Medical Aesthetics (DEMO)"
      - key: DEV_APPROVE_SAMPLE_CONTENT
        value: "true"

  - type: web
    name: phoenix-iv-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./phoenix-iv-frontend/Dockerfile
    dockerContext: ./phoenix-iv-frontend
    envVars:
      - key: VITE_API_PROXY_TARGET
        fromService:
          name: phoenix-iv-backend
          type: web
          property: hostport
